[package]
name = "gpui-note"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
tempfile = "=3.27.0"

[profile.dev]
debug = 0

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }


[dev-dependencies]
smallvec = "1"
tree-sitter = "0.25.4"

[features]
editor-diagnostics = ["gpui-component/editor-diagnostics"]
