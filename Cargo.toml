[package]
name = "gpui-note"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
image = "=0.25.10"
markdown = "=1.0.0"
chrono = "=0.4.45"
gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", features = ["tree-sitter-languages"] }
gpui-component-assets = "=0.5.1"
tempfile = "=3.27.0"
url = "=2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }


[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
smallvec = "1"
tree-sitter = "0.25.4"

[features]
editor-diagnostics = ["gpui-component/editor-diagnostics"]
