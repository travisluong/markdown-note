[package]
name = "mithril"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
image = "=0.25.10"
markdown = "=1.0.0"
chrono = "=0.4.45"
gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", features = ["tree-sitter-languages", "mermaid"] }
gpui-component-assets = "=0.5.1"
tempfile = "=3.27.0"
trash = "=5.2.8"
url = "=2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "=1.13.1"

[profile.dev]
debug = 0

[build-dependencies]
embed-resource = "=3.0.11"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }


[dev-dependencies]
gpui-component = { version = "=0.5.1", features = ["editor-diagnostics"] }
gpui = { version = "=0.2.2", features = ["test-support"] }
smallvec = "1"
tree-sitter = "0.25.4"

[features]
editor-diagnostics = ["gpui-component/editor-diagnostics"]

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Com"] }

# The editor harness includes vendor source without enabling vendor-only features.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("mermaid"))'] }
