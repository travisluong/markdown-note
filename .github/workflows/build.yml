name: Build Windows release

on:
  # Local releases use release.ps1. Hosted builds are an explicit fallback only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release eligibility
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.eligibility.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test release automation
        run: node --test .github/scripts/release.test.mjs
      - name: Accept manual builds
        id: eligibility
        run: node .github/scripts/release.mjs eligibility

  build:
    name: Build Windows x86-64
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      BUILD_TARGET: x86_64-pc-windows-msvc
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source and vendored components
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install and report pinned Rust
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain is unavailable' }
          rustup target add $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Windows target' }
          rustc --version
      - name: Validate package version
        id: version
        run: node .github/scripts/release.mjs version
      - name: Run Windows headless tests
        run: cargo test --locked --features editor-diagnostics
      - name: Build release executable
        run: cargo build --release --locked --target $env:BUILD_TARGET --bin mithril
      - name: Package Windows executable and installer
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -LiteralPath "target/$env:BUILD_TARGET/release/mithril.exe" -DestinationPath "dist/mithril-$env:APP_VERSION-windows-x86_64.zip"
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 compiler is missing from the runner' }
          $sourceDir = (Resolve-Path "target/$env:BUILD_TARGET/release").Path
          $outputDir = (Resolve-Path dist).Path
          & $compiler "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" packaging/windows/mithril.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          node .github/scripts/release.mjs checksums
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: mithril-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
